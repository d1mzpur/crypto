<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binance Multi Chart Static</title>
    <style>
      :root {
        --bg: #f7f4ee;
        --panel: #fffaf0;
        --ink: #232323;
        --muted: #6b645f;
        --accent: #d97706;
        --border: #e6dbc8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% 0%, #ffe8c2 0, transparent 45%),
          radial-gradient(circle at 100% 20%, #f9d7c0 0, transparent 35%),
          var(--bg);
      }

      .app {
        width: min(1200px, 94%);
        margin: 2rem auto;
      }

      header h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.6vw, 2.4rem);
      }

      header p {
        margin: 0.5rem 0 0.75rem;
        color: var(--muted);
      }

      .mode-badge {
        display: inline-block;
        margin-bottom: 1.4rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.3rem 0.75rem;
        font-size: 0.78rem;
        color: #4c463f;
        background: color-mix(in hsl, var(--panel) 92%, #fff);
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.8rem;
        background: color-mix(in hsl, var(--panel) 90%, #fff);
        border: 1px solid var(--border);
        padding: 1rem;
        border-radius: 12px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.9rem;
      }

      input,
      select,
      button {
        border: 1px solid #c9bba4;
        border-radius: 8px;
        padding: 0.55rem 0.7rem;
        font: inherit;
      }

      button {
        align-self: end;
        background: var(--accent);
        border: none;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(0.95);
      }

      .status {
        min-height: 1.4rem;
        margin-top: 0.8rem;
        color: var(--muted);
      }

      .info-grid {
        margin-top: 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
      }

      .info-card {
        background: color-mix(in hsl, var(--panel) 88%, #fff);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.9rem;
      }

      .info-card h2 {
        margin: 0;
        font-size: 1rem;
      }

      .metric-value {
        margin-top: 0.55rem;
        font-size: 1.35rem;
        font-weight: 700;
      }

      .metric-meta {
        margin-top: 0.25rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .feed-list {
        margin: 0.6rem 0 0;
        padding-left: 1rem;
      }

      .feed-list li {
        margin-bottom: 0.45rem;
      }

      .feed-list a {
        color: #0a6a78;
        text-decoration: none;
      }

      .feed-list a:hover {
        text-decoration: underline;
      }

      .chart-grid {
        margin-top: 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1rem;
      }

      .chart-card {
        background: color-mix(in hsl, var(--panel) 88%, #fff);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.8rem;
      }

      .chart-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.6rem;
      }

      .chart-title {
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .chart-remove {
        background: #aa1e3a;
        padding: 0.35rem 0.55rem;
        font-size: 0.8rem;
      }

      .chart-box {
        width: 100%;
        height: 320px;
      }

      @media (max-width: 640px) {
        .chart-box {
          height: 280px;
        }
      }
    </style>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Binance Multi Chart</h1>
        <p>Lihat beberapa chart crypto sekaligus dari API Binance (tanpa Node.js).</p>
        <span class="mode-badge">Mode Static - siap upload ke cPanel</span>
      </header>

      <section class="controls" aria-label="Kontrol chart">
        <label>
          Pair
          <input id="symbol" type="text" value="BTCUSDT" placeholder="Contoh: BTCUSDT" />
        </label>

        <label>
          Interval
          <select id="interval">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="4h">4h</option>
            <option value="1d">1d</option>
          </select>
        </label>

        <label>
          Jenis Chart
          <select id="chartType">
            <option value="candlestick">Candlestick</option>
            <option value="line">Line</option>
            <option value="area">Area</option>
            <option value="baseline">Baseline</option>
          </select>
        </label>

        <label>
          Data
          <select id="limit">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="300">300</option>
            <option value="500">500</option>
          </select>
        </label>

        <button id="addChart" type="button">Tambah Chart</button>
      </section>

      <section id="status" class="status" aria-live="polite"></section>

      <section class="info-grid" aria-label="Data market dan feed live">
        <article class="info-card">
          <h2>Fear & Greed</h2>
          <div id="fearGreedValue" class="metric-value">Loading...</div>
          <div id="fearGreedMeta" class="metric-meta">Menunggu data</div>
        </article>

        <article class="info-card">
          <h2>BTC Dominance</h2>
          <div id="btcDomValue" class="metric-value">Loading...</div>
          <div id="btcDomMeta" class="metric-meta">Menunggu data</div>
        </article>

        <article class="info-card">
          <h2>Crypto News</h2>
          <ul id="cryptoNewsList" class="feed-list">
            <li>Loading...</li>
          </ul>
          <div id="cryptoNewsMeta" class="metric-meta">Menunggu data</div>
        </article>

        <article class="info-card">
          <h2>Trump Feed</h2>
          <ul id="trumpFeedList" class="feed-list">
            <li>Loading...</li>
          </ul>
          <div id="trumpFeedMeta" class="metric-meta">Menunggu data</div>
        </article>
      </section>

      <section id="charts" class="chart-grid" aria-label="Daftar chart"></section>
    </main>

    <script>
      const BINANCE_BASE_URLS = ["https://api.binance.com", "https://api.binance.us"];
      const REFRESH_MS = 15_000;
      const MARKET_INFO_REFRESH_MS = 60_000;
      const FEED_REFRESH_MS = 90_000;
      const RSS2JSON_BASE = "https://api.rss2json.com/v1/api.json";

      const symbolInput = document.getElementById("symbol");
      const intervalSelect = document.getElementById("interval");
      const chartTypeSelect = document.getElementById("chartType");
      const limitSelect = document.getElementById("limit");
      const addChartButton = document.getElementById("addChart");
      const statusElement = document.getElementById("status");
      const chartsContainer = document.getElementById("charts");
      const fearGreedValueElement = document.getElementById("fearGreedValue");
      const fearGreedMetaElement = document.getElementById("fearGreedMeta");
      const btcDomValueElement = document.getElementById("btcDomValue");
      const btcDomMetaElement = document.getElementById("btcDomMeta");
      const cryptoNewsListElement = document.getElementById("cryptoNewsList");
      const cryptoNewsMetaElement = document.getElementById("cryptoNewsMeta");
      const trumpFeedListElement = document.getElementById("trumpFeedList");
      const trumpFeedMetaElement = document.getElementById("trumpFeedMeta");

      const activeCharts = new Map();

      function setStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.style.color = isError ? "#aa1e3a" : "#6b645f";
      }

      function setListItems(listElement, items) {
        listElement.innerHTML = "";
        for (const item of items) {
          const li = document.createElement("li");
          if (item.url) {
            const link = document.createElement("a");
            link.href = item.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = item.text;
            li.append(link);
          } else {
            li.textContent = item.text;
          }
          listElement.append(li);
        }
      }

      function formatLocalTimeFromUnix(unixSeconds) {
        if (!unixSeconds) return "-";
        return new Date(unixSeconds * 1000).toLocaleString("id-ID");
      }

      async function fetchJsonWithFallback(urls) {
        let lastError = "Unknown error";

        for (const url of urls) {
          try {
            const response = await fetch(url);
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`HTTP ${response.status}: ${text}`);
            }
            return await response.json();
          } catch (error) {
            lastError = error.message;
          }
        }

        throw new Error(lastError);
      }

      function toBinanceSymbol(value) {
        return value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      }

      function mapKlines(klines) {
        return klines.map((kline) => ({
          time: Math.floor(kline[0] / 1000),
          open: Number(kline[1]),
          high: Number(kline[2]),
          low: Number(kline[3]),
          close: Number(kline[4]),
          volume: Number(kline[5]),
        }));
      }

      function generateId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }

        return `chart-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      }

      async function fetchKlines(symbol, interval, limit) {
        let lastError = "Unknown error";

        for (const baseUrl of BINANCE_BASE_URLS) {
          try {
            const url = new URL(`${baseUrl}/api/v3/klines`);
            url.searchParams.set("symbol", symbol);
            url.searchParams.set("interval", interval);
            url.searchParams.set("limit", String(limit));

            const response = await fetch(url);
            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`API ${baseUrl} (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            return mapKlines(data);
          } catch (error) {
            lastError = error.message;
          }
        }

        throw new Error(lastError);
      }

      async function refreshFearGreed() {
        try {
          const data = await fetchJsonWithFallback(["https://api.alternative.me/fng/?limit=1"]);
          const current = data && data.data && data.data[0];
          if (!current) throw new Error("Data Fear & Greed kosong");

          fearGreedValueElement.textContent = `${current.value} - ${current.value_classification}`;
          fearGreedMetaElement.textContent = `Update: ${formatLocalTimeFromUnix(Number(current.timestamp))}`;
        } catch (error) {
          fearGreedValueElement.textContent = "N/A";
          fearGreedMetaElement.textContent = `Gagal: ${error.message}`;
        }
      }

      async function refreshBtcDominance() {
        try {
          const data = await fetchJsonWithFallback(["https://api.coingecko.com/api/v3/global"]);
          const btc = data && data.data && data.data.market_cap_percentage && data.data.market_cap_percentage.btc;
          const totalUsd = data && data.data && data.data.total_market_cap && data.data.total_market_cap.usd;
          if (typeof btc !== "number") throw new Error("Data dominance tidak tersedia");

          btcDomValueElement.textContent = `${btc.toFixed(2)}%`;
          const totalCapText = typeof totalUsd === "number" ? `Total cap: $${Math.round(totalUsd).toLocaleString("en-US")}` : "Total cap: -";
          btcDomMetaElement.textContent = `${totalCapText} | Update: ${new Date().toLocaleTimeString("id-ID")}`;
        } catch (error) {
          btcDomValueElement.textContent = "N/A";
          btcDomMetaElement.textContent = `Gagal: ${error.message}`;
        }
      }

      function buildRss2JsonUrl(rssUrl) {
        return `${RSS2JSON_BASE}?rss_url=${encodeURIComponent(rssUrl)}`;
      }

      async function fetchRssItems(rssUrls) {
        const jsonUrls = rssUrls.map((rssUrl) => buildRss2JsonUrl(rssUrl));
        const data = await fetchJsonWithFallback(jsonUrls);
        if (data.status !== "ok" || !Array.isArray(data.items)) {
          throw new Error("Response RSS tidak valid");
        }
        return data.items;
      }

      async function refreshCryptoNews() {
        const cryptoCompareUrl = "https://min-api.cryptocompare.com/data/v2/news/?lang=EN";
        const rssFallbacks = [
          "https://cointelegraph.com/rss",
          "https://www.coindesk.com/arc/outboundfeeds/rss/"
        ];

        try {
          let items = [];

          try {
            const data = await fetchJsonWithFallback([cryptoCompareUrl]);
            if (data.Type === 100 && Array.isArray(data.Data)) {
              items = data.Data.slice(0, 5).map((item) => ({
                text: `${item.title} (${item.source_info ? item.source_info.name : "Source"})`,
                url: item.url
              }));
            }
          } catch (error) {
            items = [];
          }

          if (items.length === 0) {
            const rssItems = await fetchRssItems(rssFallbacks);
            items = rssItems.slice(0, 5).map((item) => ({
              text: item.title,
              url: item.link
            }));
          }

          if (items.length === 0) throw new Error("Berita tidak ditemukan");

          setListItems(cryptoNewsListElement, items);
          cryptoNewsMetaElement.textContent = `Update: ${new Date().toLocaleTimeString("id-ID")}`;
        } catch (error) {
          setListItems(cryptoNewsListElement, [{ text: "Gagal memuat crypto news" }]);
          cryptoNewsMetaElement.textContent = `Gagal: ${error.message}`;
        }
      }

      async function refreshTrumpFeed() {
        const trumpRssFeeds = [
          "https://nitter.privacydev.net/realDonaldTrump/rss",
          "https://nitter.poast.org/realDonaldTrump/rss",
          "https://rsshub.app/truthsocial/user/realDonaldTrump"
        ];

        try {
          const items = await fetchRssItems(trumpRssFeeds);
          const mapped = items.slice(0, 5).map((item) => ({
            text: item.title,
            url: item.link
          }));

          if (mapped.length === 0) throw new Error("Feed kosong");

          setListItems(trumpFeedListElement, mapped);
          trumpFeedMetaElement.textContent = `Update: ${new Date().toLocaleTimeString("id-ID")}`;
        } catch (error) {
          setListItems(trumpFeedListElement, [{ text: "Gagal memuat Trump feed" }]);
          trumpFeedMetaElement.textContent = `Gagal: ${error.message}`;
        }
      }

      function startInfoPanels() {
        refreshFearGreed();
        refreshBtcDominance();
        refreshCryptoNews();
        refreshTrumpFeed();

        setInterval(refreshFearGreed, MARKET_INFO_REFRESH_MS);
        setInterval(refreshBtcDominance, MARKET_INFO_REFRESH_MS);
        setInterval(refreshCryptoNews, FEED_REFRESH_MS);
        setInterval(refreshTrumpFeed, FEED_REFRESH_MS);
      }

      function buildSeries(chart, type) {
        if (type === "candlestick") {
          return chart.addCandlestickSeries({
            upColor: "#1b8f4f",
            downColor: "#d43f36",
            borderVisible: false,
            wickUpColor: "#1b8f4f",
            wickDownColor: "#d43f36",
          });
        }

        if (type === "area") {
          return chart.addAreaSeries({
            lineColor: "#d97706",
            topColor: "rgba(217, 119, 6, 0.45)",
            bottomColor: "rgba(217, 119, 6, 0.04)",
          });
        }

        if (type === "baseline") {
          return chart.addBaselineSeries({
            baseValue: { type: "price", price: 0 },
            topLineColor: "#1b8f4f",
            topFillColor1: "rgba(27, 143, 79, 0.32)",
            topFillColor2: "rgba(27, 143, 79, 0.02)",
            bottomLineColor: "#d43f36",
            bottomFillColor1: "rgba(212, 63, 54, 0.02)",
            bottomFillColor2: "rgba(212, 63, 54, 0.28)",
          });
        }

        return chart.addLineSeries({
          color: "#0a6a78",
          lineWidth: 2,
        });
      }

      function toSeriesData(type, candles) {
        if (type === "candlestick") {
          return candles.map((c) => ({
            time: c.time,
            open: c.open,
            high: c.high,
            low: c.low,
            close: c.close,
          }));
        }

        return candles.map((c) => ({
          time: c.time,
          value: c.close,
        }));
      }

      function createChartCard({ symbol, interval, type, limit }) {
        const id = generateId();
        const card = document.createElement("article");
        card.className = "chart-card";
        card.dataset.chartId = id;

        const toolbar = document.createElement("div");
        toolbar.className = "chart-toolbar";

        const title = document.createElement("div");
        title.className = "chart-title";
        title.textContent = `${symbol} | ${interval} | ${type}`;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "chart-remove";
        removeButton.textContent = "Hapus";

        const chartBox = document.createElement("div");
        chartBox.className = "chart-box";

        toolbar.append(title, removeButton);
        card.append(toolbar, chartBox);
        chartsContainer.prepend(card);

        const chart = LightweightCharts.createChart(chartBox, {
          layout: {
            background: { color: "#fffaf0" },
            textColor: "#404040",
          },
          grid: {
            vertLines: { color: "rgba(105, 90, 70, 0.08)" },
            horzLines: { color: "rgba(105, 90, 70, 0.08)" },
          },
          rightPriceScale: {
            borderColor: "rgba(105, 90, 70, 0.2)",
          },
          timeScale: {
            borderColor: "rgba(105, 90, 70, 0.2)",
            timeVisible: true,
          },
        });

        const series = buildSeries(chart, type);

        const resizeObserver = new ResizeObserver((entries) => {
          for (const entry of entries) {
            chart.applyOptions({
              width: entry.contentRect.width,
              height: entry.contentRect.height,
            });
          }
        });
        resizeObserver.observe(chartBox);

        removeButton.addEventListener("click", () => {
          const chartState = activeCharts.get(id);
          if (!chartState) return;

          clearInterval(chartState.timer);
          chartState.resizeObserver.disconnect();
          chart.remove();
          card.remove();
          activeCharts.delete(id);

          if (activeCharts.size === 0) {
            setStatus("Tidak ada chart aktif. Tambahkan chart baru.");
          }
        });

        activeCharts.set(id, {
          id,
          symbol,
          interval,
          type,
          limit,
          chart,
          series,
          resizeObserver,
          timer: null,
        });

        return id;
      }

      async function refreshChart(id) {
        const chartState = activeCharts.get(id);
        if (!chartState) return;

        const { symbol, interval, limit, type, series } = chartState;

        try {
          const candles = await fetchKlines(symbol, interval, limit);
          series.setData(toSeriesData(type, candles));
          chartState.chart.timeScale().fitContent();
          setStatus(
            `Update terakhir: ${new Date().toLocaleTimeString("id-ID")} | ${activeCharts.size} chart aktif`
          );
        } catch (error) {
          setStatus(`Gagal update ${symbol} (${interval}): ${error.message}`, true);
        }
      }

      function startAutoRefresh(id) {
        refreshChart(id);
        const timer = setInterval(() => refreshChart(id), REFRESH_MS);
        const chartState = activeCharts.get(id);
        if (chartState) chartState.timer = timer;
      }

      function addChartFromControls() {
        const symbol = toBinanceSymbol(symbolInput.value);
        const interval = intervalSelect.value;
        const type = chartTypeSelect.value;
        const limit = Number(limitSelect.value);

        if (!symbol) {
          setStatus("Pair wajib diisi, contoh: BTCUSDT", true);
          return;
        }

        const id = createChartCard({ symbol, interval, type, limit });
        startAutoRefresh(id);
      }

      addChartButton.addEventListener("click", addChartFromControls);

      createChartCard({ symbol: "BTCUSDT", interval: "1h", type: "candlestick", limit: 200 });
      createChartCard({ symbol: "ETHUSDT", interval: "15m", type: "line", limit: 200 });
      for (const id of activeCharts.keys()) {
        startAutoRefresh(id);
      }
      startInfoPanels();
    </script>
  </body>
</html>
